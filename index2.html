<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
      integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link
      rel="icon"
      href="https://public-assets.envato-static.com/assets/icons/favicons/apple-touch-icon-114x114-precomposed-bab982e452fbea0c6821ffac2547e01e4b78e1df209253520c7c4e293849c4d3.png"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <title>Envato Market</title>
  </head>
  <body>
    <header>
      <div class="header-page2">
        <div class="logo-text">
          <img
            src="https://htmldemo.net/helendo/assets/images/logo/logo.svg"
            alt=""
          />
        </div>
        <ul>
          <li><a href="#demos">Demos</a></li>
          <li><a href="#shop">Shop</a></li>
          <li><a href="#Pages">Pages</a></li>
          <li><a href="#blog">Blog</a></li>
        </ul>
        <div class="header-icons">
          <nav class="user-icon">
            <i class="fa-regular fa-user"></i>
          </nav>
          <nav class="heart-icon">
            <i class="fa-regular fa-heart"></i>
          </nav>
          <nav class="bag-icon">
            <i class="fa-solid fa-bag-shopping"></i>
          </nav>
          <nav class="bar-icon">
            <i id="bar-icon" class="fa-solid fa-bars"></i>
          </nav>
        </div>
      </div>
      <div class="bar-in-click">
        <div class="bar-container">
          <nav class="bar-x-icon">
            <i id="x-icon" class="fa-solid fa-xmark"></i>
          </nav>
          <div class="lan-cur">
            <div class="language">
              <p>language</p>
              <a class="active-link" href="#">English</a>
              <a href="#">French</a>
              <a href="#">Arabric</a>
            </div>
            <div class="Currencies">
              <p>Currencies</p>
              <a class="active-link" href="#">USD - US Dollar</a>
              <a href="#">Euro</a>
              <a href="#">Pound</a>
            </div>
          </div>
          <div class="nav-bar-links">
            <ul>
              <li>
                <a href="#">Home</a>
                <span><i class="fa-solid fa-caret-down"></i> </span>
              </li>
              <li>
                <a href="#">Shop</a>
                <span><i class="fa-solid fa-caret-down"></i> </span>
              </li>
              <li>
                <a href="#">Pages</a>
                <span><i class="fa-solid fa-caret-down"></i> </span>
              </li>
              <li>
                <a href="#">Blog</a>
                <span><i class="fa-solid fa-caret-down"></i> </span>
              </li>
            </ul>
          </div>
          <div class="nav-Contact">
            <h3>Contact us</h3>
            <p>
              69 Halsey St, Ny 10002, New York, United States
              support.center@unero.co (0091) 8547 632521
            </p>
          </div>
          <div class="nav-Socials">
            <h3>Follow US On Socials</h3>
            <nav class="social-icons">
              <a href="#"><i class="fa-brands fa-facebook-f"></i></a>
              <a href="#"><i class="fa-brands fa-x-twitter"></i></a>
              <a href="#"><i class="fa-brands fa-linkedin-in"></i></a>
              <a href="#"><i class="fa-brands fa-pinterest-p"></i></a>
            </nav>
          </div>
        </div>
      </div>
    </header>
    <script src="script.js"></script>
  </body>
</html>
